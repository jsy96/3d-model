<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>棋盘格自动检测与复核</title>
  <style>
    :root { color-scheme:light; --ink:#172033; --muted:#64748b; --line:#dbe3ec; --blue:#2563eb; --green:#15803d; --red:#b91c1c; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f1f5f9; color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { font:inherit; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .topbar { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:18px; padding:12px 18px; background:white; border-bottom:1px solid var(--line); box-shadow:0 2px 8px #0f172a0a; }
    .brand { min-width:250px; }
    h1 { margin:0; font-size:18px; }
    .subtitle { margin-top:3px; color:var(--muted); font-size:12px; }
    .summary { flex:1; min-width:120px; color:#334155; font-size:13px; }
    .actions { display:flex; align-items:center; gap:8px; }
    .primary,.secondary { min-height:36px; padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:white; color:#334155; font-weight:650; }
    .primary { border-color:var(--blue); background:var(--blue); color:white; }
    .layout { display:grid; grid-template-columns:250px minmax(350px,1fr) 310px; gap:12px; padding:12px; height:calc(100vh - 67px); min-height:500px; }
    .panel { min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:white; }
    .photo-nav,.box-panel,.viewer { display:flex; flex-direction:column; }
    .panel-heading { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); font-weight:700; }
    .meta { color:var(--muted); font-size:11px; font-weight:400; }
    .photo-list,.box-list { overflow:auto; padding:7px; }
    .photo-item { display:grid; grid-template-columns:30px minmax(0,1fr) auto; align-items:center; gap:8px; width:100%; padding:9px; border:0; border-radius:8px; background:transparent; color:var(--ink); text-align:left; }
    .photo-item:hover { background:#f1f5f9; }
    .photo-item.active { outline:1px solid #bfdbfe; background:#eff6ff; }
    .photo-num { display:grid; width:27px; height:27px; place-items:center; border-radius:50%; background:#e2e8f0; color:#475569; font-size:11px; }
    .photo-item.active .photo-num { background:var(--blue); color:white; }
    .photo-name { overflow:hidden; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .photo-count { color:var(--muted); font-size:11px; white-space:nowrap; }
    .viewer-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:11px 13px; border-bottom:1px solid var(--line); }
    .viewer-title { min-width:0; }
    .viewer-title strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .viewer-title small { color:var(--muted); }
    .zoom-controls { display:flex; flex-shrink:0; gap:5px; }
    .small-button { padding:5px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:#334155; }
    .image-scroller { display:flex; flex:1; align-items:center; justify-content:center; overflow:auto; padding:12px; background:#111827; overscroll-behavior:contain; }
    .image-scroller.zoomed { display:block; }
    .image-scroller.pan-ready { cursor:grab; }
    .image-scroller.panning { cursor:grabbing; }
    .image-wrap { position:relative; flex:none; line-height:0; }
    #preview { display:block; width:100%; height:100%; user-select:none; -webkit-user-drag:none; }
    #overlay { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
    .caption { padding:8px 12px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
    .detect-toolbar { padding:10px; border-bottom:1px solid var(--line); }
    .detect-toolbar .primary { width:100%; margin-bottom:7px; }
    .corner-legend { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:7px; color:var(--muted); font-size:11px; }
    .corner-legend span { display:inline-flex; align-items:center; gap:4px; }
    .legend-swatch { width:11px; height:11px; border:2px solid; border-radius:3px; }
    .legend-swatch.missing { border-color:#dc2626; background:#fee2e2; }
    .legend-swatch.available { border-color:#22c55e; background:#dcfce7; }
    .box-list { flex:1; }
    .box-card { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
    .box-card.active { border-color:#60a5fa; background:#eff6ff; }
    .box-card.no-corners { border-color:#fca5a5; background:#fff7f7; }
    .box-card.no-corners.active { border-color:#dc2626; background:#fef2f2; }
    .box-card.pending { border-style:dashed; border-color:#7dd3fc; }
    .box-label { min-width:0; }
    .box-detail { display:block; margin-top:3px; color:var(--muted); font-size:11px; }
    .result-status { display:inline-flex; align-items:center; gap:5px; margin-left:7px; padding:2px 7px; border-radius:999px; background:#ecfdf5; color:#15803d; font-size:11px; font-weight:700; white-space:nowrap; }
    .result-status[data-state="pending"] { background:#e0f2fe; color:#0369a1; }
    .result-status[data-state="review"] { background:#fff7ed; color:#c2410c; }
    .result-status[data-state="missing"] { background:#fee2e2; color:#b91c1c; }
    .result-status[data-state="incomplete"] { background:#fef3c7; color:#92400e; }
    .result-status[data-state="manual"] { background:#f1f5f9; color:#475569; }
    .result-status[data-state="processing"] { background:#fef3c7; color:#92400e; }
    .box-card.processing { border-color:#f59e0b; background:#fffbeb; box-shadow:0 0 0 2px #f59e0b33; }
    .box-card.processing.active { border-color:#d97706; background:#fef3c7; }
    .processing-status { display:inline-flex; align-items:center; gap:5px; color:#b45309; font-weight:700; white-space:nowrap; }
    .processing-spinner { width:12px; height:12px; border:2px solid #fcd34d; border-top-color:#b45309; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .box-actions { display:flex; flex-shrink:0; align-items:center; gap:8px; }
    .box-card button { border:0; background:transparent; color:var(--red); font-size:12px; }
    .box-card button.refine { color:#1d4ed8; }
    .box-card button.accept { color:#0369a1; }
    .box-card button.dismiss { color:#64748b; }
    .box-card button:disabled { cursor:not-allowed; opacity:.5; }
    .empty { margin:auto; padding:24px; color:#94a3b8; text-align:center; }
    .toast { position:fixed; bottom:16px; left:50%; z-index:5; transform:translateX(-50%); padding:9px 13px; border-radius:8px; background:#166534; color:white; box-shadow:0 5px 18px #0f172a33; opacity:0; pointer-events:none; transition:opacity .2s; }
    .toast.show { opacity:1; }
    @media (max-width:1050px) { .layout { grid-template-columns:190px minmax(300px,1fr); height:auto; min-height:calc(100vh - 67px); } .box-panel { grid-column:1/-1; max-height:330px; } .box-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:6px; } .box-card { margin:0; } }
    @media (max-width:650px) { .topbar { flex-wrap:wrap; gap:8px 12px; } .brand { min-width:0; } .summary { order:3; flex-basis:100%; } .actions { margin-left:auto; } .layout { display:flex; flex-direction:column; height:auto; min-height:calc(100vh - 100px); padding:8px; gap:8px; } .photo-nav { max-height:170px; } .photo-list { display:flex; gap:4px; overflow:auto; } .photo-item { min-width:190px; } .viewer { min-height:52vh; } .box-panel { max-height:none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>棋盘格自动检测与复核</h1><div class="subtitle">当前项目：生产项目　·　数据目录：data</div></div>
    <div class="summary" id="summary">正在读取本目录的图片…</div>
    <div class="actions">
      <label class="secondary" for="uploadInput">上传图片</label>
      <input id="uploadInput" type="file" accept="image/*" multiple hidden>
      <button class="secondary" id="exportButton" type="button">导出框选 JSON</button>
    </div>
  </header>
  <main class="layout">
    <aside class="panel photo-nav">
      <div class="panel-heading"><span>照片</span><span id="imageCount" class="meta">0 张</span></div>
      <div class="photo-list" id="photoList"><div class="empty">正在读取图片…</div></div>
    </aside>
    <section class="panel viewer">
      <div class="viewer-head">
        <div class="viewer-title"><strong id="currentName">等待图片</strong><small id="currentSummary"></small></div>
        <div class="zoom-controls">
          <button class="small-button" id="zoomOut" type="button" title="缩小">−</button>
          <button class="small-button" id="zoomFit" type="button" title="适应窗口">适应</button>
          <button class="small-button" id="zoomIn" type="button" title="放大">+</button>
        </div>
      </div>
      <div class="image-scroller" id="imageScroller"><div class="empty">从左侧选择一张照片</div></div>
      <div class="caption" id="caption">滚轮缩放；按住空格并拖动平移；左键拖动可手动补框。</div>
    </section>
    <aside class="panel box-panel">
      <div class="panel-heading"><span>棋盘格结果</span><span id="boxCount" class="meta">0 块</span></div>
      <div class="detect-toolbar">
        <button class="primary" id="detectButton" type="button">自动检测本图</button>
        <div id="detectionStatus" class="meta" role="status" aria-live="polite">检测结果会显示在下方列表</div>
        <div class="corner-legend"><span><i class="legend-swatch missing"></i>红框：仅区域框选</span><span><i class="legend-swatch available"></i>绿/橙框：有角点数据</span></div>
        <div id="cornerSummary" class="meta" aria-live="polite"></div>
      </div>
      <div class="box-list" id="boxList"><div class="empty">点击“自动检测本图”，或拖动鼠标补框</div></div>
    </aside>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    const state = { images: [], current: -1, boxes: {}, imageSizes: {}, dirtyNames: new Set(), savingNames: new Map(), selected: -1, naturalWidth: 0, naturalHeight: 0, fitWidth: 0, displayWidth: 0, saveTimer: 0, drawing: null, panning: null, spaceDown:false, refining: null, detecting: null, proposals: {}, detectionInfo: {}, proposalSelected: -1 };
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
    const image = () => state.images[state.current];
    const boxes = () => image() ? (state.boxes[image().name] || []) : [];
    const proposals = () => image() ? (state.proposals[image().name] || []) : [];
    const hasCornerPairs = (box) => Array.isArray(box?.corners) && Array.isArray(box?.grid_indices) && box.corners.length > 0 && box.corners.length === box.grid_indices.length;
    const busy = () => Boolean(state.detecting || state.refining);
    const isRefiningBox = (name, box) => Boolean(state.refining && state.refining.name === name && state.refining.box === box);
    const boxPoints = (box) => box.points || [
      { x:box.x, y:box.y }, { x:box.x + box.w, y:box.y },
      { x:box.x + box.w, y:box.y + box.h }, { x:box.x, y:box.y + box.h }
    ];

    function resultEntries() {
      const saved = deduplicateSaved(boxes());
      const pending = [];
      for (const candidate of proposals()) {
        if (saved.some((box) => sameBoard(candidate, box))) continue;
        const duplicateIndex = pending.findIndex((box) => sameBoard(candidate, box));
        if (duplicateIndex < 0) pending.push(candidate);
        else {
          const old = pending[duplicateIndex];
          if ((candidate.corners?.length || 0) + (candidate.confidence || 0) > (old.corners?.length || 0) + (old.confidence || 0)) pending[duplicateIndex] = candidate;
        }
      }
      return [
        ...saved.map((box) => ({ box, saved:true, index:boxes().indexOf(box) })),
        ...pending.map((box) => ({ box, saved:false, index:proposals().indexOf(box) }))
      ];
    }

    function deduplicateSaved(items) {
      const unique = [];
      const score = (box) => (box.corners?.length || 0) * 100 + (box.confidence || 0) * 10 + (box.points ? 1 : 0);
      for (const box of items) {
        const index = unique.findIndex((old) => sameBoard(box, old));
        if (index < 0) unique.push(box);
        else if (score(box) > score(unique[index])) unique[index] = box;
      }
      return unique;
    }

    function resultStatus(box, saved, processing) {
      if (processing) return ["processing", "正在贴合"];
      if (!hasCornerPairs(box)) return ["missing", "无角点数据"];
      if (box.partial) return ["incomplete", "不完整"];
      if (box.needs_review) return ["review", "需复核"];
      if (!saved) return ["pending", "待确认"];
      if (!box.points) return ["manual", "待贴合"];
      return ["saved", "已保存"];
    }

    function normalizeSavedBoxes() {
      for (const [name, current] of Object.entries(state.boxes)) {
        const unique = deduplicateSaved(current);
        if (unique.length !== current.length) {
          state.boxes[name] = unique;
          markDirty(name);
        }
      }
    }

    async function request(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "请求失败");
      return data;
    }

    function updateSummary() {
      const allBoxes = Object.values(state.boxes).flat();
      const count = allBoxes.length;
      const withCorners = allBoxes.filter(hasCornerPairs).length;
      const withoutCorners = count - withCorners;
      const saving = state.savingNames.size > 0;
      $("summary").textContent = "生产项目/data · " + state.images.length + " 张照片 · 已保存 " + count + " 个棋盘框 · " + (saving ? "正在保存…" : state.dirtyNames.size ? "等待保存" : "已保存");
      $("imageCount").textContent = state.images.length + " 张";
      $("boxCount").textContent = resultEntries().length + " 块";
      $("cornerSummary").textContent = "全部照片：红框 " + withoutCorners + " 块无角点数据 · 有角点 " + withCorners + " 块";
      const currentImage = image();
      $("detectButton").disabled = !currentImage || !state.naturalWidth || busy();
      $("detectButton").textContent = state.detecting ? "正在检测…" : "自动检测本图";
      $("detectButton").setAttribute("aria-busy", String(Boolean(state.detecting)));
      $("uploadInput").disabled = busy();
      const info = currentImage ? state.detectionInfo[currentImage.name] : null;
      $("detectionStatus").textContent = state.detecting === currentImage?.name
        ? "正在扫描整张照片、定位棋盘角点…"
        : info ? "本次检测 " + info.count + " 块 · 不完整 " + info.partial + " 块 · " + info.seconds + " 秒" + (info.limited ? " · 候选过多，已限制搜索范围" : "")
        : "检测结果会显示在下方列表";
      $("currentSummary").textContent = resultEntries().length + " 个棋盘格结果";
      $("caption").textContent = "滚轮缩放；按住空格并拖动平移；左键拖动可手动补框。";
    }

    function renderPhotoList() {
      const list = $("photoList");
      list.innerHTML = "";
      if (!state.images.length) {
        list.innerHTML = '<div class="empty">本目录没有找到图片</div>';
        return;
      }
      state.images.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = "photo-item" + (index === state.current ? " active" : "");
        button.type = "button";
        button.title = item.name;
        button.innerHTML = '<span class="photo-num">' + String(index + 1).padStart(2, "0") + '</span><span class="photo-name">' + esc(item.name) + '</span><span class="photo-count">' + (state.boxes[item.name] || []).length + '框</span>';
        button.addEventListener("click", () => selectImage(index));
        list.append(button);
      });
    }

    function renderBoxes() {
      const list = $("boxList");
      list.innerHTML = "";
      const entries = resultEntries();
      if (!entries.length) {
        list.innerHTML = '<div class="empty">点击“自动检测本图”，或拖动鼠标补框</div>';
      } else {
        entries.forEach((entry, displayIndex) => {
          const { box, saved, index } = entry;
          const item = document.createElement("div");
          const missingCorners = !hasCornerPairs(box);
          const processing = saved && isRefiningBox(image()?.name, box);
          const selected = saved ? index === state.selected : index === state.proposalSelected;
          const [stateName, stateLabel] = resultStatus(box, saved, processing);
          const detail = missingCorners ? "仅区域框选 · 无角点和网格坐标" : box.corners.length + " 个角点" + (box.detected_squares ? " · 棋盘 " + box.detected_squares[0] + "×" + box.detected_squares[1] + " 格" : "");
          item.className = "box-card" + (selected ? " active" : "") + (!saved ? " pending" : "") + (processing ? " processing" : "") + (missingCorners ? " no-corners" : "");
          const actions = saved
            ? '<button class="refine" type="button" aria-label="重新贴合此框">重新贴合</button><button class="remove" type="button" aria-label="删除此框">删除</button>'
            : '<button class="accept" type="button" aria-label="保留此检测结果">保留</button><button class="dismiss" type="button" aria-label="忽略此检测结果">忽略</button>';
          item.innerHTML = '<span class="box-label"><strong>棋盘格 ' + String(displayIndex + 1).padStart(2, "0") + '</strong><span class="result-status" data-state="' + stateName + '">' + (processing ? '<span class="processing-spinner" aria-hidden="true"></span>' : '') + stateLabel + '</span>' + (detail ? '<small class="box-detail">' + detail + '</small>' : '') + '</span><div class="box-actions">' + actions + '</div>';
          item.addEventListener("click", () => {
            if (saved) { state.selected = index; state.proposalSelected = -1; }
            else { state.selected = -1; state.proposalSelected = index; }
            renderAll();
          });
          if (saved) {
            item.querySelector(".refine").disabled = busy();
            item.querySelector(".refine").addEventListener("click", (event) => {
              event.stopPropagation(); state.selected = index; renderAll(); refineBox(index);
            });
            const deleteButton = item.querySelector(".remove");
            deleteButton.disabled = processing;
            deleteButton.title = processing ? "该框正在贴合，暂时不能删除" : "删除此框";
            deleteButton.addEventListener("click", (event) => { event.stopPropagation(); removeBox(index); });
          } else {
            item.querySelector(".accept").disabled = busy();
            item.querySelector(".accept").addEventListener("click", (event) => { event.stopPropagation(); acceptCandidate(box); });
            item.querySelector(".dismiss").disabled = busy();
            item.querySelector(".dismiss").addEventListener("click", (event) => {
              event.stopPropagation();
              state.proposals[image().name] = proposals().filter((candidate) => candidate !== box);
              state.proposalSelected = -1; renderAll();
            });
          }
          list.append(item);
        });
      }
      updateSummary();
    }

    function renderAll() {
      renderPhotoList();
      renderBoxes();
      drawOverlay();
    }

    function selectImage(index) {
      state.current = index;
      state.selected = -1;
      state.proposalSelected = -1;
      state.naturalWidth = 0;
      state.naturalHeight = 0;
      state.drawing = null;
      const item = image();
      $("currentName").textContent = item.name;
      $("currentSummary").textContent = (state.boxes[item.name] || []).length + " 个已保存框";
      const scroller = $("imageScroller");
      scroller.classList.remove("zoomed");
      scroller.innerHTML = '<div class="image-wrap" id="imageWrap"><img id="preview" alt="待检测棋盘格的照片"><canvas id="overlay"></canvas></div>';
      const photo = $("preview");
      photo.onload = () => {
        if (image()?.name !== item.name) return;
        state.naturalWidth = photo.naturalWidth;
        state.naturalHeight = photo.naturalHeight;
        state.imageSizes[item.name] = { width:photo.naturalWidth, height:photo.naturalHeight };
        fitImage();
        renderAll();
      };
      photo.onerror = () => { scroller.innerHTML = '<div class="empty">图片读取失败：' + esc(item.name) + '</div>'; };
      photo.src = item.url;
      renderAll();
    }

    function fitImage() {
      const scroller = $("imageScroller");
      if (!image() || !state.naturalWidth || !$("preview")) return;
      const maxW = Math.max(100, scroller.clientWidth - 26);
      const maxH = Math.max(100, scroller.clientHeight - 26);
      state.fitWidth = Math.min(state.naturalWidth, maxW, maxH * state.naturalWidth / state.naturalHeight);
      state.displayWidth = state.fitWidth;
      applyImageSize();
    }

    function applyImageSize() {
      const wrap = $("imageWrap");
      const photo = $("preview");
      if (!wrap || !photo || !state.displayWidth) return;
      const height = state.displayWidth * state.naturalHeight / state.naturalWidth;
      wrap.style.width = state.displayWidth + "px";
      wrap.style.height = height + "px";
      $("imageScroller").classList.toggle("zoomed", state.displayWidth > state.fitWidth + 1);
      drawOverlay();
    }

    function zoomAt(nextWidth, clientX, clientY) {
      if (!state.fitWidth || !state.displayWidth) return;
      const scroller = $("imageScroller"), rect = scroller.getBoundingClientRect();
      const next = Math.max(state.fitWidth, Math.min(state.naturalWidth * 2, nextWidth));
      const imageRect = $("imageWrap").getBoundingClientRect();
      const imageX = Math.max(0, Math.min(1, (clientX - imageRect.left) / imageRect.width));
      const imageY = Math.max(0, Math.min(1, (clientY - imageRect.top) / imageRect.height));
      state.displayWidth = next;
      applyImageSize();
      if (next > state.fitWidth + 1) {
        scroller.scrollLeft = Math.max(0, 12 + imageX * next - (clientX - rect.left - scroller.clientLeft));
        const nextHeight = next * state.naturalHeight / state.naturalWidth;
        scroller.scrollTop = Math.max(0, 12 + imageY * nextHeight - (clientY - rect.top - scroller.clientTop));
      } else {
        scroller.scrollLeft = 0;
        scroller.scrollTop = 0;
      }
    }

    function drawOverlay() {
      const canvas = $("overlay");
      if (!canvas || !state.naturalWidth) return;
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      boxes().forEach((box, index) => {
        const missingCorners = !hasCornerPairs(box);
        const points = boxPoints(box).map((point) => ({ x:point.x * rect.width, y:point.y * rect.height }));
        ctx.fillStyle = missingCorners ? "rgba(239,68,68,.14)" : index === state.selected ? "rgba(37,99,235,.17)" : "rgba(34,197,94,.12)";
        ctx.strokeStyle = missingCorners ? "#dc2626" : index === state.selected ? "#60a5fa" : box.needs_review ? "#f59e0b" : "#22c55e";
        ctx.lineWidth = index === state.selected ? 3 : 2;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        points.slice(1).forEach((point) => ctx.lineTo(point.x, point.y));
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = missingCorners ? "#b91c1c" : index === state.selected ? "#1d4ed8" : "#15803d";
        ctx.font = "bold 14px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText(String(index + 1), points[0].x + 5, Math.max(16, points[0].y + 18));
        if (index === state.selected) drawCorners(ctx, box, rect);
      });
      resultEntries().filter((entry) => !entry.saved).forEach((entry, index) => {
        const box = entry.box;
        const points = boxPoints(box).map((point) => ({ x:point.x * rect.width, y:point.y * rect.height }));
        ctx.strokeStyle = box.needs_review ? "#f59e0b" : "#38bdf8";
        ctx.lineWidth = entry.index === state.proposalSelected ? 3 : 1.5;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        points.slice(1).forEach((point) => ctx.lineTo(point.x, point.y));
        ctx.closePath();
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = box.needs_review ? "#fbbf24" : "#7dd3fc";
        ctx.fillText("A" + (index + 1), points[0].x + 4, Math.max(14, points[0].y - 5));
        if (entry.index === state.proposalSelected) drawCorners(ctx, box, rect);
      });
      if (state.drawing) {
        const x = Math.min(state.drawing.x0, state.drawing.x1);
        const y = Math.min(state.drawing.y0, state.drawing.y1);
        const w = Math.abs(state.drawing.x1 - state.drawing.x0);
        const h = Math.abs(state.drawing.y1 - state.drawing.y0);
        ctx.fillStyle = "rgba(250,204,21,.18)";
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.fillRect(x * rect.width, y * rect.height, w * rect.width, h * rect.height);
        ctx.strokeRect(x * rect.width, y * rect.height, w * rect.width, h * rect.height);
        ctx.setLineDash([]);
      }
    }

    function drawCorners(ctx, box, rect) {
      ctx.fillStyle = "#fef08a";
      (box.corners || []).forEach(([x, y]) => {
        ctx.beginPath(); ctx.arc(x * rect.width, y * rect.height, 2, 0, Math.PI * 2); ctx.fill();
      });
    }

    function signedArea(points) {
      return points.reduce((sum, p, i) => { const q = points[(i + 1) % points.length]; return sum + p.x * q.y - p.y * q.x; }, 0) / 2;
    }

    function sameBoard(first, second) {
      const a = boxPoints(first), b = boxPoints(second);
      let output = a.slice();
      const orientation = signedArea(b) >= 0 ? 1 : -1;
      const cross = (u, v, p) => (v.x - u.x) * (p.y - u.y) - (v.y - u.y) * (p.x - u.x);
      for (let i = 0; i < b.length && output.length; i += 1) {
        const u = b[i], v = b[(i + 1) % b.length], input = output;
        output = [];
        let previous = input[input.length - 1], previousCross = cross(u, v, previous);
        for (const point of input) {
          const pointCross = cross(u, v, point);
          const inside = pointCross * orientation >= -1e-12;
          const previousInside = previousCross * orientation >= -1e-12;
          if (inside !== previousInside) {
            const fraction = previousCross / (previousCross - pointCross);
            output.push({ x:previous.x + fraction * (point.x - previous.x), y:previous.y + fraction * (point.y - previous.y) });
          }
          if (inside) output.push(point);
          previous = point; previousCross = pointCross;
        }
      }
      return Math.abs(signedArea(output)) / Math.max(1e-12, Math.min(Math.abs(signedArea(a)), Math.abs(signedArea(b)))) > 0.45;
    }

    function acceptCandidate(candidate) {
      if (!image() || busy()) return;
      const name = image().name, current = state.boxes[name] || [];
      let index = current.findIndex((old) => sameBoard(candidate, old));
      if (index < 0) {
        current.push(candidate);
        index = current.length - 1;
      } else if ((candidate.corners?.length || 0) > (current[index].corners?.length || 0)) {
        current[index] = candidate;
      }
      state.boxes[name] = current;
      state.proposals[name] = proposals().filter((old) => old !== candidate);
      state.selected = index;
      state.proposalSelected = -1;
      markDirty(name);
      renderAll();
      showToast("检测结果已加入棋盘格列表");
    }

    $("detectButton").addEventListener("click", async () => {
      const name = image()?.name;
      if (!name || busy()) return;
      state.detecting = name;
      state.drawing = null;
      renderAll();
      try {
        const result = await request("/api/detect", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ name }) });
        state.proposals[name] = result.boxes || [];
        state.imageSizes[name] = { width:result.image_width, height:result.image_height };
        state.detectionInfo[name] = { count:result.boxes.length, partial:result.boxes.filter((box) => box.partial).length, seconds:result.elapsed_seconds, limited:result.limited };
        state.proposalSelected = -1;
        renderAll();
        showToast(result.boxes.length ? "检测完成，结果已合并到棋盘格列表" : "没有找到可靠棋盘，可以手动框选可见网格重试", !result.boxes.length);
      } catch (error) {
        showToast("自动检测失败：" + error.message, true);
      } finally {
        state.detecting = null;
        renderAll();
      }
    });

    function pointerPoint(event) {
      const rect = $("overlay").getBoundingClientRect();
      return { x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)), y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height)) };
    }

    $("imageScroller").addEventListener("pointerdown", (event) => {
      if (!image() || state.detecting) return;
      if (state.spaceDown && event.button === 0) {
        state.panning = { pointerId:event.pointerId, x:event.clientX, y:event.clientY, left:$("imageScroller").scrollLeft, top:$("imageScroller").scrollTop };
        $("imageScroller").classList.add("panning");
        event.target.setPointerCapture(event.pointerId);
        event.preventDefault();
        return;
      }
      if (event.target.id !== "overlay" || event.button !== 0) return;
      const point = pointerPoint(event);
      state.drawing = { x0: point.x, y0: point.y, x1: point.x, y1: point.y };
      event.target.setPointerCapture(event.pointerId);
      drawOverlay();
    });
    $("imageScroller").addEventListener("pointermove", (event) => {
      if (state.panning?.pointerId === event.pointerId) {
        const scroller = $("imageScroller"), drag = state.panning;
        scroller.scrollLeft = drag.left - (event.clientX - drag.x);
        scroller.scrollTop = drag.top - (event.clientY - drag.y);
        return;
      }
      if (event.target.id !== "overlay") return;
      const point = pointerPoint(event);
      if (!state.drawing) return;
      state.drawing.x1 = point.x;
      state.drawing.y1 = point.y;
      drawOverlay();
    });
    $("imageScroller").addEventListener("pointerup", (event) => {
      if (state.panning?.pointerId === event.pointerId) {
        state.panning = null;
        $("imageScroller").classList.remove("panning");
        return;
      }
      if (!state.drawing || event.target.id !== "overlay") return;
      const d = state.drawing;
      const x = Math.min(d.x0, d.x1), y = Math.min(d.y0, d.y1);
      const w = Math.abs(d.x1 - d.x0), h = Math.abs(d.y1 - d.y0);
      state.drawing = null;
      if (w * state.displayWidth < 12 || h * state.displayWidth * state.naturalHeight / state.naturalWidth < 12) {
        drawOverlay();
        return;
      }
      const name = image().name, list = boxes();
      const box = { x:x, y:y, w:w, h:h };
      list.push(box);
      state.boxes[name] = deduplicateSaved(list);
      state.selected = state.boxes[name].indexOf(box);
      if (state.selected < 0) state.selected = state.boxes[name].length - 1;
      markDirty();
      renderAll();
      refineBox(state.selected);
    });
    $("imageScroller").addEventListener("pointercancel", () => {
      if (state.panning) { state.panning = null; $("imageScroller").classList.remove("panning"); }
      state.drawing = null; drawOverlay();
    });

    function removeBox(index) {
      const list = boxes();
      if (index < 0 || index >= list.length) return;
      if (isRefiningBox(image()?.name, list[index])) {
        showToast("该框正在贴合，暂时不能删除。", true);
        return;
      }
      list.splice(index, 1);
      state.selected = -1;
      markDirty();
      renderAll();
    }

    async function refineBox(index) {
      const currentImage = image();
      const name = currentImage?.name;
      const box = name ? (state.boxes[name] || [])[index] : null;
      if (!name || !box || busy()) return;
      const seedPoints = box.seed_points || boxPoints(box);
      state.refining = { name, box };
      renderAll();
      try {
        const result = await request("/api/refine", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({ name:name, points:seedPoints })
        });
        if (!(state.boxes[name] || []).includes(box)) return;
        Object.assign(box, result);
        delete box.ok;
        box.seed_points = result.seed_points || seedPoints;
        delete box.x;
        delete box.y;
        delete box.w;
        delete box.h;
        state.boxes[name] = deduplicateSaved(state.boxes[name] || []);
        state.selected = state.boxes[name].indexOf(box);
        markDirty(name);
        renderAll();
        showToast("已贴合" + (result.partial ? "局部棋盘，建议放大复核" : "完整棋盘") + " · " + result.corners.length + " 个角点");
      } catch (error) {
        showToast(error.message + "，原框已保留。", true);
      } finally {
        state.refining = null;
        renderAll();
      }
    }
    $("zoomIn").addEventListener("click", () => { if (state.fitWidth) { const rect = $("imageScroller").getBoundingClientRect(); zoomAt(state.displayWidth * 1.25, rect.left + rect.width / 2, rect.top + rect.height / 2); } });
    $("zoomOut").addEventListener("click", () => { if (state.fitWidth) { const rect = $("imageScroller").getBoundingClientRect(); zoomAt(state.displayWidth / 1.25, rect.left + rect.width / 2, rect.top + rect.height / 2); } });
    $("zoomFit").addEventListener("click", fitImage);
    $("imageScroller").addEventListener("wheel", (event) => {
      if (!state.fitWidth || !state.displayWidth || !image()) return;
      event.preventDefault();
      zoomAt(state.displayWidth * Math.exp(-event.deltaY * 0.0015), event.clientX, event.clientY);
    }, { passive:false });
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space" && !event.repeat && !["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(document.activeElement?.tagName)) {
        state.spaceDown = true;
        $("imageScroller").classList.add("pan-ready");
        event.preventDefault();
      }
    });
    window.addEventListener("keyup", (event) => {
      if (event.code === "Space") {
        state.spaceDown = false;
        $("imageScroller").classList.remove("pan-ready", "panning");
        state.panning = null;
      }
    });
    window.addEventListener("blur", () => {
      state.spaceDown = false; state.panning = null;
      $("imageScroller").classList.remove("pan-ready", "panning");
    });
    window.addEventListener("resize", () => { if (image()) fitImage(); });
    window.addEventListener("keydown", (event) => {
      if (!state.images.length) return;
      if (event.key === "ArrowLeft" && !state.spaceDown) selectImage(Math.max(0, state.current - 1));
      if (event.key === "ArrowRight" && !state.spaceDown) selectImage(Math.min(state.images.length - 1, state.current + 1));
      if ((event.key === "Delete" || event.key === "Backspace") && state.selected >= 0) removeBox(state.selected);
      if (event.key === "Escape") { state.drawing = null; drawOverlay(); }
    });

    function markDirty(name = image()?.name) {
      if (!name) return;
      state.dirtyNames.add(name);
      updateSummary();
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(() => {
        Promise.all(Array.from(state.dirtyNames).map((dirtyName) => saveBoxes(dirtyName))).catch(() => {});
      }, 350);
    }

    async function saveBoxes(name) {
      if (!state.dirtyNames.has(name)) return;
      if (state.savingNames.has(name)) {
        await state.savingNames.get(name);
        if (state.dirtyNames.has(name)) return saveBoxes(name);
        return;
      }
      const snapshot = JSON.stringify(state.boxes[name] || []);
      const size = state.imageSizes[name] || {};
      const task = request("/api/boxes", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ name:name, boxes:state.boxes[name] || [], image_width:size.width, image_height:size.height })
      }).then(() => {
        if (JSON.stringify(state.boxes[name] || []) === snapshot) state.dirtyNames.delete(name);
      }).catch((error) => {
        showToast("保存失败：" + error.message, true);
        throw error;
      });
      state.savingNames.set(name, task);
      updateSummary();
      try {
        await task;
      } finally {
        state.savingNames.delete(name);
        updateSummary();
        if (state.dirtyNames.has(name)) state.saveTimer = setTimeout(() => saveBoxes(name).catch(() => {}), 800);
      }
    }

    $("exportButton").addEventListener("click", async () => {
      clearTimeout(state.saveTimer);
      try {
        const names = Array.from(state.dirtyNames);
        await Promise.all(names.map((name) => saveBoxes(name)));
        window.location.href = "/api/export.json";
      } catch (_) {
        showToast("保存未完成，请确认本机网页服务正常后重试。", true);
      }
    });

    $("uploadInput").addEventListener("change", async (event) => {
      const files = Array.from(event.target.files || []);
      event.target.value = "";
      if (!files.length) return;
      const previousName = image()?.name;
      try {
        await Promise.all(Array.from(state.dirtyNames).map((name) => saveBoxes(name)));
      } catch (_) {
        showToast("标注尚未保存，上传已暂停；请确认本机网页服务正常后重试。", true);
        return;
      }
      let uploaded = 0;
      const failures = [];
      for (let index = 0; index < files.length; index += 1) {
        const file = files[index];
        $("summary").textContent = "正在上传到 生产项目/data/images：" + (index + 1) + "/" + files.length;
        try {
          await request("/api/upload?name=" + encodeURIComponent(file.name), {
            method:"POST",
            headers:{"Content-Type":file.type || "application/octet-stream"},
            body:file
          });
          uploaded += 1;
        } catch (error) {
          failures.push(file.name + "：" + error.message);
        }
      }
      try {
        const data = await request("/api/data");
        state.images = data.images || [];
        state.boxes = data.boxes || {};
        state.imageSizes = data.image_sizes || {};
        normalizeSavedBoxes();
        renderAll();
        const selectedIndex = state.images.findIndex((item) => item.name === previousName);
        if (selectedIndex >= 0) selectImage(selectedIndex);
        else if (state.images.length) selectImage(0);
        if (failures.length) showToast("已上传 " + uploaded + " 张；失败 " + failures.length + " 张：" + failures[0], true);
        else showToast("已上传 " + uploaded + " 张到 生产项目/data/images");
      } catch (error) {
        showToast("上传后刷新列表失败：" + error.message, true);
      }
    });

    let toastTimer;
    function showToast(message, error) {
      const toast = $("toast");
      toast.textContent = message;
      toast.style.background = error ? "#b91c1c" : "#166534";
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }

    async function init() {
      try {
        const data = await request("/api/data");
        state.images = data.images;
        state.boxes = data.boxes || {};
        state.imageSizes = data.image_sizes || {};
        normalizeSavedBoxes();
        $("summary").textContent = state.images.length + " 张照片 · 框选会自动保存到本机";
        renderAll();
        if (state.images.length) selectImage(0);
      } catch (error) {
        $("summary").textContent = "读取失败：" + error.message;
        $("photoList").innerHTML = '<div class="empty">' + esc(error.message) + '</div>';
      }
    }
    init();
  </script>
</body>
</html>
